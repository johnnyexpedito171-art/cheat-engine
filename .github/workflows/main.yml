name: Build CEServer Android Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Verify NDK
        run: |
          echo "NDK_HOME=$ANDROID_NDK_HOME"
          ls $ANDROID_NDK_HOME

      - name: Build CEServer (ndk-build)
        working-directory: Cheat Engine/ceserver/ndk-build/EXECUTABLE
        run: |
          $ANDROID_NDK_HOME/ndk-build \
            APP_ABI="armeabi-v7a arm64-v8a x86 x86_64" \
            NDK_DEBUG=0 \
            V=1

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find "Cheat Engine/ceserver/ndk-build/EXECUTABLE/libs" -type f -exec cp --parents {} artifacts/ \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ceserver-android-release
          path: artifacts
